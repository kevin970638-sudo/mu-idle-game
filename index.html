
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>MU Idle - 3D RPG</title>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101522;
      font-family: Arial, sans-serif;
    }
    #game {
      width: 100%;
      height: 100%;
      display: block;
    }
    #title {
      position: absolute;
      top: 15px;
      left: 15px;
      color: #f5cf7b;
      font-size: 24px;
      font-weight: bold;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="title">MU IDLE RPG</div>
  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const engine = new BABYLON.Engine(canvas, true);

    const createScene = () => {
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(
        0.05, 0.07, 0.12, 1
      );

      const camera = new BABYLON.ArcRotateCamera(
        "camera",
        -Math.PI / 2,
        Math.PI / 3,
        15,
        new BABYLON.Vector3(0, 0, 0),
        scene
      );
      camera.attachControl(canvas, true);

      const light = new BABYLON.HemisphericLight(
        "light",
        new BABYLON.Vector3(0, 1, 0),
        scene
      );
      light.intensity = 1.2;

      const ground = BABYLON.MeshBuilder.CreateGround(
        "ground",
        { width: 20, height: 20 },
        scene
      );

      const groundMat = new BABYLON.StandardMaterial(
        "groundMat", scene
      );
      groundMat.diffuseColor =
        new BABYLON.Color3(0.15, 0.3, 0.2);
      ground.material = groundMat;

      const hero = BABYLON.MeshBuilder.CreateCapsule(
        "hero",
        { height: 2, radius: 0.5 },
        scene
      );
      hero.position.y = 1;

      const heroMat = new BABYLON.StandardMaterial(
        "heroMat", scene
      );
      heroMat.diffuseColor =
        new BABYLON.Color3(0.2, 0.5, 1);
      hero.material = heroMat;

      return scene;
    };

    const scene = createScene();

    engine.runRenderLoop(() => {
      scene.render();
    });

    window.addEventListener("resize", () => {
      engine.resize();
    });
  </script>
</body>
</html>
